name: Build and publish .so release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag untuk Release (mis. v1.0.0). Kosongkan jika hanya ingin build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  NDK_VERSION: r29

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang make unzip curl lld file

      - name: Restore NDK archive cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk.zip
          key: ndk-${{ env.NDK_VERSION }}-linux-zip

      - name: Download & extract Android NDK
        id: download-ndk
        run: |
          set -euo pipefail
          # Nama arsip resmi sejak NDK r23+: android-ndk-rXX-linux.zip (TANPA -x86_64)
          ARCHIVE_NAME="android-ndk-${NDK_VERSION}-linux.zip"
          DOWNLOAD_URL="https://dl.google.com/android/repository/${ARCHIVE_NAME}"
          ZIP="${RUNNER_TEMP}/ndk.zip"
          CACHE_DIR="${RUNNER_TEMP}/android-ndk-cache"
          DEST_DIR="${CACHE_DIR}/android-ndk-${NDK_VERSION}"

          if [ -f "${ZIP}" ]; then
            echo "Arsip NDK ditemukan dari cache."
          else
            echo "Downloading ${DOWNLOAD_URL} ..."
            curl -fsSL --retry 3 -o "${ZIP}" "${DOWNLOAD_URL}"
          fi

          if [ ! -d "${DEST_DIR}" ]; then
            echo "Extracting ..."
            mkdir -p "${CACHE_DIR}"
            unzip -q "${ZIP}" -d "${CACHE_DIR}"
            if [ ! -d "${DEST_DIR}" ]; then
              EXTRACTED=$(find "${CACHE_DIR}" -maxdepth 1 -type d -name "android-ndk-*" | head -n1)
              [ -n "${EXTRACTED}" ] && mv "${EXTRACTED}" "${DEST_DIR}"
            fi
          fi

          if [ ! -x "${DEST_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "ERROR: NDK tidak valid di ${DEST_DIR}" >&2
            exit 1
          fi
          printf 'ndk_root=%s\n' "${DEST_DIR}" >> "$GITHUB_OUTPUT"

      - name: Set NDK env for Makefile
        run: |
          echo "NDK_ROOT=${{ steps.download-ndk.outputs.ndk_root }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.download-ndk.outputs.ndk_root }}" >> $GITHUB_ENV
          echo "${{ steps.download-ndk.outputs.ndk_root }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Diagnostics (target Makefile & info)
        run: |
          echo "== Target yang tersedia di Makefile =="
          grep -hE '^[A-Za-z0-9_.-]+ *:' Makefile 2>/dev/null | sort -u || true
          echo "== make info =="
          make info || true
          echo "NDK_ROOT=$NDK_ROOT"

      - name: Build
        run: |
          set -euo pipefail
          # FIX: 'make preload' gagal karena target tidak ada.
          # README repo: target default adalah iQOO-13 (jalankan 'make' polos).
          # Variabel dilewat via command-line agar menimpa DEFAULT_NDK_ROOT Makefile.
          MV="NDK_ROOT=${NDK_ROOT} ANDROID_NDK_HOME=${NDK_ROOT}"
          if grep -qE '^preload *:' Makefile 2>/dev/null; then
            echo "== Build target: preload =="
            make ${MV} preload -j"$(nproc)"
          else
            echo "== Target 'preload' tidak ada; build target default (iQOO-13) =="
            make ${MV} -j"$(nproc)"
          fi

      - name: List produced artifacts
        run: |
          echo "Produced .so files:"
          find . -type f -name "*.so" -not -path "./.git/*" -print || true
          echo "Build tree:"
          find build out -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Collect artifacts (.so, fallback ELF)
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release_assets

          mapfile -t FILES < <(find . -type f -name '*.so' -not -path './.git/*' -not -path './.github/*')

          # FALLBACK: jika Makefile menghasilkan ELF tanpa ekstensi .so
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Tidak ada *.so — mencari output ELF hasil build ..."
            mapfile -t FILES < <(find . -type f \
              -not -path './.git/*' -not -path './.github/*' \
              -not -name '*.o' -not -name '*.a' -not -name '*.c' -not -name '*.h' \
              -not -name '*.S' -not -name '*.md' -not -name '*.yml' -not -name '*.zip' \
              -not -name 'Makefile' -not -name 'makefile' \
              | while IFS= read -r f; do
                  file -b "$f" 2>/dev/null | grep -q 'ELF' && printf '%s\n' "$f"
                done)
          fi

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERROR: Tidak ada artifact hasil build (.so maupun ELF)." >&2
            exit 1
          fi

          DESTS=()
          idx=0
          for f in "${FILES[@]}"; do
            base=$(basename "$f")
            dest="release_assets/${base}"
            if [ -e "$dest" ]; then dest="release_assets/${idx}_${base}"; fi
            cp "$f" "$dest"
            DESTS+=("$dest")
            idx=$((idx+1))
          done

          {
            echo "files<<EOF"
            printf '%s\n' "${DESTS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Collected ${#DESTS[@]} file(s):"
          printf '  %s\n' "${DESTS[@]}"

      - name: Upload artifact (selalu, tiap run)
        uses: actions/upload-artifact@v4
        with:
          name: preload-libs-${{ github.run_id }}
          path: release_assets/
          if-no-files-found: error
          retention-days: 14

      - name: Determine release tag
        id: rel
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${INPUT_TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          [ -n "${TAG}" ] && echo "create=true" >> "$GITHUB_OUTPUT" || echo "create=false" >> "$GITHUB_OUTPUT"
          echo "Release target: ${TAG:-<kosong: artifact only>}"

      - name: Create Release and upload asset(s)
        if: steps.rel.outputs.create == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.rel.outputs.tag }}
          name: Release ${{ steps.rel.outputs.tag }}
          files: ${{ steps.collect.outputs.files }}
          draft: false
          prerelease: false
          allowUpdates: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\` / ref: \`${GITHUB_REF}\`"
            echo "- NDK: \`${NDK_VERSION}\`"
            echo "- Release: \`${{ steps.rel.outputs.create }}\` (tag: \`${{ steps.rel.outputs.tag }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
