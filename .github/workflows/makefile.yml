name: Build and publish .so release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag untuk Release (mis. v1.0.0). Kosongkan jika hanya ingin build.'
        required: false
        default: ''
      kernel_versions:
        description: 'Kernel versions to build (comma-separated: 6.6.89,6.6.127 or all)'
        required: false
        default: 'all'

permissions:
  contents: write

env:
  NDK_VERSION: r29

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang make unzip curl lld file

      - name: Restore NDK archive cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk.zip
          key: ndk-${{ env.NDK_VERSION }}-linux-zip

      - name: Download & extract Android NDK
        id: download-ndk
        run: |
          set -euo pipefail
          ARCHIVE_NAME="android-ndk-${NDK_VERSION}-linux.zip"
          DOWNLOAD_URL="https://dl.google.com/android/repository/${ARCHIVE_NAME}"
          ZIP="${RUNNER_TEMP}/ndk.zip"
          CACHE_DIR="${RUNNER_TEMP}/android-ndk-cache"
          DEST_DIR="${CACHE_DIR}/android-ndk-${NDK_VERSION}"

          if [ -f "${ZIP}" ]; then
            echo "Arsip NDK ditemukan dari cache."
          else
            echo "Downloading ${DOWNLOAD_URL} ..."
            curl -fsSL --retry 3 -o "${ZIP}" "${DOWNLOAD_URL}"
          fi

          if [ ! -d "${DEST_DIR}" ]; then
            echo "Extracting ..."
            mkdir -p "${CACHE_DIR}"
            unzip -q "${ZIP}" -d "${CACHE_DIR}"
            if [ ! -d "${DEST_DIR}" ]; then
              EXTRACTED=$(find "${CACHE_DIR}" -maxdepth 1 -type d -name "android-ndk-*" | head -n1)
              [ -n "${EXTRACTED}" ] && mv "${EXTRACTED}" "${DEST_DIR}"
            fi
          fi

          if [ ! -x "${DEST_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "ERROR: NDK tidak valid di ${DEST_DIR}" >&2
            exit 1
          fi
          printf 'ndk_root=%s\n' "${DEST_DIR}" >> "$GITHUB_OUTPUT"

      - name: Set NDK env for Makefile
        run: |
          echo "NDK_ROOT=${{ steps.download-ndk.outputs.ndk_root }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.download-ndk.outputs.ndk_root }}" >> $GITHUB_ENV
          echo "${{ steps.download-ndk.outputs.ndk_root }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Determine kernel versions to build
        id: kernels
        run: |
          set -euo pipefail
          INPUT="${{ inputs.kernel_versions }}"
          
          if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
            VERSIONS="6.6.89 6.6.127"
            echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
            echo "Building all kernel versions: $VERSIONS"
          else
            VERSIONS=$(echo "$INPUT" | tr ',' ' ' | tr -s ' ')
            echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
            echo "Building kernel versions: $VERSIONS"
          fi

      - name: Diagnostics (target Makefile & info)
        run: |
          echo "== Target yang tersedia di Makefile =="
          grep -hE '^[A-Za-z0-9_.-]+ *:' Makefile 2>/dev/null | sort -u || true
          echo "== make list-kernels =="
          make list-kernels || true
          echo "NDK_ROOT=$NDK_ROOT"

      - name: Build for all kernel versions
        run: |
          set -euo pipefail
          VERSIONS="${{ steps.kernels.outputs.versions }}"
          
          echo "Starting build for kernel versions: $VERSIONS"
          
          for VERSION in $VERSIONS; do
            echo ""
            echo "========================================"
            echo "Building for kernel version: $VERSION"
            echo "========================================"
            
            MV="NDK_ROOT=${NDK_ROOT} ANDROID_NDK_HOME=${NDK_ROOT} KERNEL_VERSION=${VERSION}"
            
            if grep -qE '^preload *:' Makefile 2>/dev/null; then
              echo "== Build target: preload (KERNEL_VERSION=$VERSION) =="
              make ${MV} preload -j"$(nproc)"
            else
              echo "== Target 'preload' tidak ada; build target default =="
              make ${MV} -j"$(nproc)"
            fi
            
            echo "Build for kernel $VERSION completed"
          done

      - name: List produced artifacts
        run: |
          echo "Produced .so files:"
          find . -type f -name "*.so" -not -path "./.git/*" -print || true
          echo ""
          echo "Build tree (top 30 files):"
          find build -maxdepth 5 -type f -print 2>/dev/null | head -30 || true
          echo ""
          echo "Full build directory structure:"
          ls -laR build/ 2>/dev/null | head -100 || true

      - name: Collect artifacts (.so per kernel)
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release_assets
          
          echo "Collecting artifacts..."
          echo "Current directory: $(pwd)"
          echo "Build directory contents:"
          ls -la build/ 2>/dev/null || echo "No build directory"
          
          # Collect .so files from build directories
          mapfile -t FILES < <(find build -type f -name "*.so" 2>/dev/null | sort)
          
          echo "Found ${#FILES[@]} .so files"
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERROR: Tidak ada *.so ditemukan di build directory." >&2
            echo "Listing all build artifacts:"
            find build -type f 2>/dev/null | head -20 || true
            exit 1
          fi
          
          DESTS=()
          idx=0
          for f in "${FILES[@]}"; do
            base=$(basename "$f")
            dir=$(dirname "$f")
            
            echo "Processing: $f (dir: $dir)"
            
            if [[ "$dir" == *"6.6.89"* ]]; then
              dest="release_assets/preload_6.6.89.so"
            elif [[ "$dir" == *"6.6.127"* ]]; then
              dest="release_assets/preload_6.6.127.so"
            else
              dest="release_assets/${base}"
            fi
            
            if [ -e "$dest" ]; then
              dest="release_assets/${idx}_${base}"
            fi
            
            cp "$f" "$dest"
            DESTS+=("$dest")
            idx=$((idx+1))
            
            echo "Collected: $dest (from $f)"
          done
          
          if [ ${#DESTS[@]} -eq 0 ]; then
            echo "ERROR: Tidak ada artifact berhasil dikumpulkan." >&2
            exit 1
          fi
          
          {
            echo "files<<EOF"
            printf '%s\n' "${DESTS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Collected ${#DESTS[@]} file(s)"

      - name: Display collected artifacts
        if: success()
        run: |
          echo "=== Collected Artifacts ==="
          ls -lah release_assets/
          echo ""
          echo "SHA256 checksums:"
          sha256sum release_assets/*

      - name: Upload artifacts (untuk semua kernel versions)
        uses: actions/upload-artifact@v4
        with:
          name: preload-libs-multi-kernel-${{ github.run_id }}
          path: release_assets/
          if-no-files-found: error
          retention-days: 14

      - name: Determine release tag
        id: rel
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${INPUT_TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          [ -n "${TAG}" ] && echo "create=true" >> "$GITHUB_OUTPUT" || echo "create=false" >> "$GITHUB_OUTPUT"
          echo "Release target: ${TAG:-<kosong: artifact only>}"

      - name: Create Release and upload asset(s)
        if: steps.rel.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            # Build Details
            - **Kernel Versions**: ${{ steps.kernels.outputs.versions }}
            - **NDK Version**: ${{ env.NDK_VERSION }}
            
            ## Files Included
            Preload libraries (.so) untuk kernel versions:
            - `preload_6.6.89.so` - Kernel 6.6.89
            - `preload_6.6.127.so` - Kernel 6.6.127

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "### Build Configuration"
            echo "- **Trigger**: \`${GITHUB_EVENT_NAME}\` / ref: \`${GITHUB_REF}\`"
            echo "- **NDK Version**: \`${NDK_VERSION}\`"
            echo "- **Kernel Versions Built**: \`${{ steps.kernels.outputs.versions }}\`"
            echo ""
            echo "### Results"
            echo "- **Release Created**: \`${{ steps.rel.outputs.create }}\`"
            echo "- **Release Tag**: \`${{ steps.rel.outputs.tag }}\`"
            echo "- **Artifacts Status**: ✅ Uploaded"
            echo ""
            echo "### Download Artifacts"
            echo "Visit **Actions** → workflow run → **Artifacts** section"
            echo "- preload_6.6.89.so"
            echo "- preload_6.6.127.so"
          } >> "$GITHUB_STEP_SUMMARY"
