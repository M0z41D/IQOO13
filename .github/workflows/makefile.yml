name: Build and publish .so release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag untuk Release (mis. v1.0.0). Kosongkan jika hanya ingin build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Selaras dengan Makefile DEFAULT_NDK_ROOT
  NDK_VERSION: r29

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang make unzip curl lld

      # Cache arsip zip NDK agar run berikutnya tidak download ulang ±780 MB
      - name: Restore NDK archive cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk.zip
          key: ndk-${{ env.NDK_VERSION }}-linux-zip

      - name: Download & extract Android NDK
        id: download-ndk
        run: |
          set -euo pipefail
          # FIX: nama arsip resmi sejak NDK r23+ adalah android-ndk-rXX-linux.zip
          # (TANPA -x86_64). Nama lama menyebabkan 404 -> curl exit 22.
          ARCHIVE_NAME="android-ndk-${NDK_VERSION}-linux.zip"
          DOWNLOAD_URL="https://dl.google.com/android/repository/${ARCHIVE_NAME}"
          ZIP="${RUNNER_TEMP}/ndk.zip"
          CACHE_DIR="${RUNNER_TEMP}/android-ndk-cache"
          DEST_DIR="${CACHE_DIR}/android-ndk-${NDK_VERSION}"

          if [ -f "${ZIP}" ]; then
            echo "Arsip NDK ditemukan dari cache."
          else
            echo "Downloading ${DOWNLOAD_URL} ..."
            curl -fsSL --retry 3 -o "${ZIP}" "${DOWNLOAD_URL}"
          fi

          if [ -d "${DEST_DIR}" ]; then
            echo "NDK sudah diekstrak di ${DEST_DIR}"
          else
            echo "Extracting ..."
            mkdir -p "${CACHE_DIR}"
            unzip -q "${ZIP}" -d "${CACHE_DIR}"
            if [ ! -d "${DEST_DIR}" ]; then
              EXTRACTED=$(find "${CACHE_DIR}" -maxdepth 1 -type d -name "android-ndk-*" | head -n1)
              if [ -n "${EXTRACTED}" ]; then
                mv "${EXTRACTED}" "${DEST_DIR}"
              fi
            fi
          fi

          # Validasi: pastikan toolchain benar-benar ada sebelum lanjut
          if [ ! -x "${DEST_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "ERROR: NDK tidak valid di ${DEST_DIR}" >&2
            exit 1
          fi
          printf 'ndk_root=%s\n' "${DEST_DIR}" >> "$GITHUB_OUTPUT"

      - name: Set NDK env for Makefile
        run: |
          echo "NDK_ROOT=${{ steps.download-ndk.outputs.ndk_root }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.download-ndk.outputs.ndk_root }}" >> $GITHUB_ENV
          echo "${{ steps.download-ndk.outputs.ndk_root }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Show make info (diagnostics)
        run: |
          echo "Makefile info:"
          make info || true
          echo "Environment summary:"
          echo "NDK_ROOT=$NDK_ROOT"
          ls "${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin" | head -n 20 || true
          clang --version || true

      - name: Build (make preload)
        run: |
          set -euo pipefail
          make preload -j"$(nproc)"

      - name: List produced artifacts
        run: |
          echo "Produced .so files:"
          find . -type f -name "*.so" -not -path "./.git/*" -print || true
          echo "Build tree:"
          find build -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Collect .so assets
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release_assets
          mapfile -t SO_FILES < <(find . -type f -name '*.so' -not -path './.git/*' -not -path './.github/*')
          if [ ${#SO_FILES[@]} -eq 0 ]; then
            echo "ERROR: Tidak ada file .so yang dihasilkan build." >&2
            exit 1
          fi
          DESTS=()
          idx=0
          for f in "${SO_FILES[@]}"; do
            base=$(basename "$f")
            dest="release_assets/${base}"
            if [ -e "$dest" ]; then
              dest="release_assets/${idx}_${base}"
            fi
            cp "$f" "$dest"
            DESTS+=("$dest")
            idx=$((idx+1))
          done
          # Output multiline: aman untuk nama file apa pun & didukung release-action
          {
            echo "files<<EOF"
            printf '%s\n' "${DESTS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Collected ${#DESTS[@]} file(s)"

      # FIX: .so SELALU bisa diunduh dari halaman run (bagian Artifacts),
      # baik trigger tag maupun manual.
      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: preload-libs-${{ github.run_id }}
          path: release_assets/
          if-no-files-found: error
          retention-days: 14

      # FIX: release bisa dibuat dari push tag ATAU input manual
      - name: Determine release tag
        id: rel
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG=""
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" ]]; then
            echo "create=true" >> "$GITHUB_OUTPUT"
          else
            echo "create=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Release target: ${TAG:-<kosong: artifact only>}"

      - name: Create Release and upload .so asset(s)
        if: steps.rel.outputs.create == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.rel.outputs.tag }}
          name: Release ${{ steps.rel.outputs.tag }}
          files: ${{ steps.collect.outputs.files }}
          draft: false
          prerelease: false
          allowUpdates: true   # re-run pada tag yang sama tidak akan gagal

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build .so summary"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\` / ref: \`${GITHUB_REF}\`"
            echo "- NDK: \`${NDK_VERSION}\`"
            echo "- Release dibuat: \`${{ steps.rel.outputs.create }}\` (tag: \`${{ steps.rel.outputs.tag }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
