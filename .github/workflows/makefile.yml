name: Build and publish .so release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Align NDK with Makefile DEFAULT_NDK_ROOT
  NDK_VERSION: r29

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang make unzip curl lld

      - name: Prepare runner temp NDK cache dir
        run: |
          mkdir -p "${RUNNER_TEMP}/android-ndk-cache"
          echo "NDK_CACHE_DIR=${RUNNER_TEMP}/android-ndk-cache" >> $GITHUB_ENV

      - name: Download Android NDK (cached)
        id: download-ndk
        run: |
          set -euo pipefail
          # FIX: Sejak NDK r23+, arsip Linux bernama "android-ndk-rXX-linux.zip"
          # (TANPA suffix -x86_64). Nama lama menyebabkan 404 -> curl exit 22.
          ARCHIVE_NAME="android-ndk-${NDK_VERSION}-linux.zip"
          DOWNLOAD_URL="https://dl.google.com/android/repository/${ARCHIVE_NAME}"
          DEST_DIR="${NDK_CACHE_DIR}/android-ndk-${NDK_VERSION}"

          if [ -d "${DEST_DIR}" ]; then
            echo "NDK already downloaded at ${DEST_DIR}"
          else
            echo "Downloading ${DOWNLOAD_URL} ..."
            if ! curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${ARCHIVE_NAME}" "${DOWNLOAD_URL}"; then
              # Fallback: pola nama lama (hanya berlaku untuk NDK <= r22)
              LEGACY_NAME="android-ndk-${NDK_VERSION}-linux-x86_64.zip"
              echo "Primary URL failed, trying legacy name ${LEGACY_NAME} ..."
              curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${ARCHIVE_NAME}" \
                "https://dl.google.com/android/repository/${LEGACY_NAME}"
            fi

            echo "Extracting to ${NDK_CACHE_DIR} ..."
            unzip -q "${RUNNER_TEMP}/${ARCHIVE_NAME}" -d "${NDK_CACHE_DIR}"
            if [ ! -d "${DEST_DIR}" ]; then
              EXTRACTED=$(find "${NDK_CACHE_DIR}" -maxdepth 1 -type d -name "android-ndk-*" | head -n1)
              if [ -n "${EXTRACTED}" ]; then
                mv "${EXTRACTED}" "${DEST_DIR}"
              fi
            fi
          fi
          printf '%s\n' "ndk_root=${DEST_DIR}" >> $GITHUB_OUTPUT

      - name: Set NDK env for Makefile
        run: |
          echo "NDK_ROOT=${{ steps.download-ndk.outputs.ndk_root }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.download-ndk.outputs.ndk_root }}" >> $GITHUB_ENV
          echo "${{ steps.download-ndk.outputs.ndk_root }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Show make info (diagnostics)
        run: |
          echo "Makefile info:"
          make info || true
          echo "Environment summary:"
          echo "NDK_ROOT=$NDK_ROOT"
          which aarch64-linux-android${API:-35}-clang || true
          clang --version || true

      - name: Build (make preload)
        run: |
          set -euo pipefail
          make preload -j$(nproc)

      - name: List produced artifacts
        run: |
          echo "Produced .so files:"
          find . -type f -name "*.so" -not -path "./.git/*" -print || true
          echo "Build tree:"
          find build -maxdepth 3 -type f -print || true

      - name: Collect .so assets
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release_assets
          mapfile -t SO_FILES < <(find . -type f -name '*.so' -not -path './.git/*' -not -path './.github/*')
          if [ ${#SO_FILES[@]} -eq 0 ]; then
            echo "No .so files were produced." >&2
            exit 1
          fi
          FILE_LIST=""
          idx=0
          for f in "${SO_FILES[@]}"; do
            base=$(basename "$f")
            dest="release_assets/${base}"
            if [ -e "$dest" ]; then
              dest="release_assets/${idx}_${base}"
            fi
            cp "$f" "$dest"
            FILE_LIST="${FILE_LIST} ${dest}"
            idx=$((idx+1))
          done
          FILE_LIST=$(echo $FILE_LIST)
          printf '%s\n' "files=${FILE_LIST}" >> $GITHUB_OUTPUT

      - name: Create Release and upload .so asset(s)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: ${{ steps.collect.outputs.files }}
          draft: false
          prerelease: false
